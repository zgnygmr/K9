<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>K9 emblem</title>
  <!-- seal background + double ring -->
  <circle cx="256" cy="256" r="246" fill="#ffffff" stroke="#000000" stroke-width="8"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- radial ticks -->
  <g stroke="#000000" stroke-width="2">
    <g id="t"><line x1="256" y1="14" x2="256" y2="26"/></g>
    <use href="#t" transform="rotate(30 256 256)"/><use href="#t" transform="rotate(60 256 256)"/>
    <use href="#t" transform="rotate(90 256 256)"/><use href="#t" transform="rotate(120 256 256)"/>
    <use href="#t" transform="rotate(150 256 256)"/><use href="#t" transform="rotate(180 256 256)"/>
    <use href="#t" transform="rotate(210 256 256)"/><use href="#t" transform="rotate(240 256 256)"/>
    <use href="#t" transform="rotate(270 256 256)"/><use href="#t" transform="rotate(300 256 256)"/>
    <use href="#t" transform="rotate(330 256 256)"/>
  </g>
  <!-- faceted shepherd head, profile facing right -->
  <g fill="none" stroke="#000000" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="368,272 336,240 306,228 278,210 268,196 292,118 246,162 216,112 204,182 192,212 172,292 216,356 282,332 322,304 330,288 362,290"/>
  </g>
  <!-- inner facet lines -->
  <g fill="none" stroke="#000000" stroke-width="2">
    <polyline points="306,228 296,244 322,304"/>
    <polyline points="246,162 204,182"/>
    <polyline points="278,210 246,162"/>
    <polyline points="282,332 296,244"/>
  </g>
  <!-- eye -->
  <polygon points="288,244 296,236 306,244 296,252" fill="#000000"/>
  <!-- constellation nodes -->
  <g fill="#000000">
    <circle cx="368" cy="272" r="5"/><circle cx="336" cy="240" r="5"/><circle cx="306" cy="228" r="5"/>
    <circle cx="278" cy="210" r="5"/><circle cx="268" cy="196" r="5"/><circle cx="292" cy="118" r="5"/>
    <circle cx="246" cy="162" r="5"/><circle cx="216" cy="112" r="5"/><circle cx="204" cy="182" r="5"/>
    <circle cx="192" cy="212" r="5"/><circle cx="172" cy="292" r="5"/><circle cx="216" cy="356" r="5"/>
    <circle cx="282" cy="332" r="5"/><circle cx="322" cy="304" r="5"/><circle cx="330" cy="288" r="5"/>
    <circle cx="362" cy="290" r="5"/>
  </g>
  <!-- four-pointed sparkles -->
  <g fill="#000000">
    <path d="M118 150 l3.2 8.8 8.8 3.2 -8.8 3.2 -3.2 8.8 -3.2 -8.8 -8.8 -3.2 8.8 -3.2 z"/>
    <path d="M398 142 l3.2 8.8 8.8 3.2 -8.8 3.2 -3.2 8.8 -3.2 -8.8 -8.8 -3.2 8.8 -3.2 z"/>
    <path d="M136 358 l3.2 8.8 8.8 3.2 -8.8 3.2 -3.2 8.8 -3.2 -8.8 -8.8 -3.2 8.8 -3.2 z"/>
  </g>
  <!-- monogram -->
  <text x="256" y="432" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" letter-spacing="6" fill="#000000">K9</text>
</svg>
